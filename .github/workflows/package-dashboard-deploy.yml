name: Release dashboard deployment

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must start with v, for example v0.1.0)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: dashboard-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and release Pages Direct Upload ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/$RELEASE_TAG"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build web assets
        run: |
          npm run typecheck
          npm run build

      - name: Bundle the Pages advanced-mode Worker
        run: |
          mkdir -p dashboard-package
          npx wrangler deploy --dry-run --outfile dashboard-package/_worker.js
          cp -R dist/. dashboard-package/

      - name: Validate package contents
        run: |
          test -f dashboard-package/index.html
          test -f dashboard-package/_worker.js
          test -n "$(find dashboard-package/assets -type f -print -quit)"
          test ! -e dashboard-package/.dev.vars
          test ! -e dashboard-package/wrangler.jsonc
          test ! -e dashboard-package/migrations

      - name: Create ZIP
        run: |
          cd dashboard-package
          zip -r ../cloud-clipboard-pages.zip .

      - name: Inspect ZIP
        run: |
          unzip -t cloud-clipboard-pages.zip
          unzip -Z1 cloud-clipboard-pages.zip | grep -qx 'index.html'
          unzip -Z1 cloud-clipboard-pages.zip | grep -qx '_worker.js'
          sha256sum cloud-clipboard-pages.zip > cloud-clipboard-pages.zip.sha256

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              cloud-clipboard-pages.zip \
              cloud-clipboard-pages.zip.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              cloud-clipboard-pages.zip \
              cloud-clipboard-pages.zip.sha256 \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
